<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>u u — App Review photos</title>
  <style>
    :root { color-scheme: light dark; --bg:#F6F1EA; --fg:#121011; --muted:#57514F; --rule:#DDD5C9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121011; --fg:#F6F1EA; --muted:#A79F9C; --rule:#2C2827; }
    }
    * { box-sizing:border-box; }
    body { margin:0; padding:min(9vw,64px) 20px 96px; background:var(--bg); color:var(--fg);
           font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    main { max-width:46rem; margin:0 auto; }
    h1 { font-size:1.9rem; letter-spacing:-.02em; margin:0 0 .35em; }
    p { color:var(--muted); max-width:38rem; }
    .instruction { color:var(--fg); font-weight:600; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:32px; }
    figure { margin:0; }
    img { display:block; width:100%; height:auto; border:1px solid var(--rule); }
    figcaption { padding-top:7px; color:var(--muted); font-size:.86rem; }
    @media (max-width:540px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Photos for reviewing u u</h1>
    <p>These six portraits show one fictional adult created with image generation solely as
       test data for App Review. They do not depict a real person.</p>
    <p class="instruction">Before opening u u, touch and hold each image below and choose
       “Save to Photos.” Then select all six when u u asks for photos.</p>
    <div class="grid">
      <figure><img src="photo-01-front-neutral.jpg" alt="Synthetic adult, front view, neutral expression"><figcaption>1 · Front, neutral</figcaption></figure>
      <figure><img src="photo-02-left-three-quarter.jpg" alt="Synthetic adult, left three-quarter view"><figcaption>2 · Left three-quarter</figcaption></figure>
      <figure><img src="photo-03-left-profile.jpg" alt="Synthetic adult, left profile"><figcaption>3 · Left profile</figcaption></figure>
      <figure><img src="photo-04-right-three-quarter.jpg" alt="Synthetic adult, right three-quarter view"><figcaption>4 · Right three-quarter</figcaption></figure>
      <figure><img src="photo-05-right-profile.jpg" alt="Synthetic adult, right profile"><figcaption>5 · Right profile</figcaption></figure>
      <figure><img src="photo-06-front-smile.jpg" alt="Synthetic adult, front view, smiling"><figcaption>6 · Front, smiling</figcaption></figure>
    </div>
  </main>
</body>
</html>
